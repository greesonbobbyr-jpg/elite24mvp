# Hourly jobs (Vercel Hobby crons are daily-only, so GitHub Actions carries
# the schedule):
#  - the check-in reminder push: the endpoint decides per-team whether the
#    current hour matches the coach's setting — most runs are no-ops;
#  - the announcement-picture cleanup: deletes the pictures of announcements
#    that disappeared or were deleted (and uploads never sent).
# Requires the CRON_SECRET repo secret (Settings → Secrets → Actions)
# matching the Vercel env var of the same name.
name: check-in-reminders

on:
  schedule:
    - cron: "0 * * * *" # top of every hour (UTC)
  workflow_dispatch: {} # manual test runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder endpoint
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://elite24mvp.vercel.app/api/cron/check-in-reminders"
      - name: Delete pictures of disappeared announcements
        if: always()
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://elite24mvp.vercel.app/api/cron/expire-media"
